<!-- uback 图标母版（16/32/48/256px）：透明底 + 彩色 U 盘 + 白色对勾
     图案自绘，不引用第三方图标库 → 无许可/署名义务。
     各尺寸均由本母版缩放。
     配色：身体绿 #27ae60（亮/暗任务栏都醒目）、描边深绿 #0b3d24、插头近白 #e9faf1、对勾白。
     半透明白色外发光（opacity 0.45）：深色任务栏上勾出轮廓，浅色任务栏几乎不可见。
     icon.ico 是构建产物：build.ts 缺失时调用 scripts/gen-icon.mjs 现场生成到 dist/，不入库。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35c374"/>
      <stop offset="1" stop-color="#1e8e4c"/>
    </linearGradient>
  </defs>
  <!-- 外发光（仅深色背景可见） -->
  <g fill="#ffffff" opacity="0.45">
    <rect x="72" y="16" width="112" height="72" rx="12"/>
    <rect x="48" y="64" width="160" height="184" rx="20"/>
  </g>
  <!-- 插头（金属触点） -->
  <rect x="80" y="24" width="96" height="56" rx="10" fill="#0b3d24"/>
  <rect x="92" y="36" width="72" height="32" rx="4" fill="#e9faf1"/>
  <rect x="108" y="36" width="6" height="32" fill="#0b3d24" opacity="0.45"/>
  <rect x="142" y="36" width="6" height="32" fill="#0b3d24" opacity="0.45"/>
  <!-- U 盘身体 -->
  <rect x="56" y="72" width="144" height="168" rx="16" fill="#0b3d24"/>
  <rect x="64" y="80" width="128" height="152" rx="12" fill="url(#body)"/>
  <!-- 备份完成对勾 -->
  <path d="M88 160 L120 196 L168 120"
        fill="none" stroke="#ffffff" stroke-width="24"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
