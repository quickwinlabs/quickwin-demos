<!-- deskmon exe 图标（图案 A：近黑悬浮条 + 上升折线）
     改图后跑 node scripts/gen-icon.mjs demos/deskmon 重新生成 icon.ico -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 挂件本体：近黑圆角横条（匹配 deskmon 深色半透风格） -->
  <rect x="3" y="13" width="42" height="22" rx="5" fill="#1b1b1d"/>
  <!-- 数据折线：三段上升 -->
  <polyline points="11,28 19,21 26,24 37,16"
            fill="none" stroke="#fafafa" stroke-width="2.5"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- 折线末端高亮点 -->
  <circle cx="37" cy="16" r="2.5" fill="#fafafa"/>
</svg>
