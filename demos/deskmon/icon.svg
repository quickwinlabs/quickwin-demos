<!-- deskmon exe 图标：深色圆角方片 + 白色仪表盘（性能/速度隐喻）
     图案自绘（仪表弧 + 指针 + 轴点），不引用第三方图标库 → 无许可/署名义务。
     XP 不认 PNG 条目，故 gen-icon.mjs 为 16/24/32/48 额外生成 32bpp BMP 条目。
     改图后跑 node scripts/gen-icon.mjs demos/deskmon 重新生成 icon.ico -->
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <!-- 底片：近黑圆角方片（明暗托盘/资源管理器/Alt-Tab 下都有对比度） -->
  <rect x="2" y="2" width="44" height="44" rx="11" fill="#1b1b1d"/>
  <!-- 仪表弧：圆心 (24,27) 半径 13，从 210° 经顶部到 330°（下方留口），线宽 4.5 -->
  <path d="M12.74 33.5 A13 13 0 1 1 35.26 33.5"
        fill="none" stroke="#fafafa" stroke-width="4.5" stroke-linecap="round"/>
  <!-- 指针：轴向 ~35° 右上 -->
  <path d="M24 27 L31.4 21.8"
        fill="none" stroke="#fafafa" stroke-width="4" stroke-linecap="round"/>
  <!-- 轴点 -->
  <circle cx="24" cy="27" r="3" fill="#fafafa"/>
</svg>
