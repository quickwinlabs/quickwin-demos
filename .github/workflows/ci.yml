name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (tsc + esbuild + brotli embed)
        run: npm run build

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: deskmon
          path: |
            dist/deskmon.exe
            dist/deskmon.js

      - name: Assemble GitHub Pages
        run: |
          mkdir -p _pages
          cp dist/deskmon.exe _pages/
          cp -r pages/. _pages/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages

  deploy-pages:
    # 仅 main 的 push 发布；PR 只构建验证
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
